<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Urbana Inmobiliaria</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="encabezado-sitio">
        <div class="contenedor-header">
            <!--Menu de navegacion principal-->
            <nav class="navegacion-principal">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="listado-propiedades.html">Propiedades</a></li>
                    <li><a href="contacto.html" class="activo">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- FORMULARIO DE CONTACTO-->
    <main class="contenedor-contacto-sencillo">
        <div class="caja-formulario">
            <h1>Contacto</h1>
            <p>Déjanos tu mensaje y te responderemos pronto.</p>

            <form>
                <input type="text" placeholder="Tu Nombre" required>
                <input type="email" placeholder="Tu Correo Electrónico" required>
                <textarea rows="4" placeholder="¿Cómo te podemos ayudar?" required></textarea>
                <button type="submit">Enviar</button>
            </form>
        </div>
    </main>

</body>
</html>
